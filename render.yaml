# Render Blueprint — deploy LitCopilot as one Docker web service.
# https://render.com/docs/blueprint-spec
#
# Usage: push this repo to GitHub, then in Render: New → Blueprint → pick the repo.
# Render injects $PORT automatically; the Dockerfile CMD already respects it.
services:
  - type: web
    name: litcopilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false            # set this in the Render dashboard (kept secret)
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      # Supabase Postgres — data now lives here, so it survives redeploys.
      - key: DATABASE_URL
        sync: false            # Session-pooler URI, incl. the DB password
      - key: SUPABASE_URL
        sync: false            # used to verify access tokens via JWKS
      # Publishable client config, baked into the frontend at build time.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # Persist saved library + history across deploys.
    # NOTE: Render disks require a paid instance type; the free plan is ephemeral.
    # disk:
    #   name: litcopilot-data
    #   mountPath: /app/backend/data
    #   sizeGB: 1
